apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp1
  namespace: mytg
spec:
  replicas: 5
  selector:
    matchLabels:
     env: stage
  template:
    metadata:
     labels:
       env: stage
    spec:
     imagePullSecrets:
       - name: <SECRET-NAME-at-k8s-Master>
     containers:
       - name: tomcat
         image: <CHANGE-YOUR-DOCKER-HUB-REPONAME-HERE>:pname-buildnum
         ports:
          - containerPort: 8080
